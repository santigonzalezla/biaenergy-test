[project]
name = "biaenergy-ai-service"
version = "0.1.0"
description = "Explainable anomaly detection engine for energy meters"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
