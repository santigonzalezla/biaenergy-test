name: biaenergy

services:
  postgres:
    image: postgres:16-alpine
    container_name: biaenergy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: biaenergy-ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      PORT: 8000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: biaenergy-backend:local
    container_name: biaenergy-migrator
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: biaenergy-backend:local
    container_name: biaenergy-seed
    profiles: ["seed"]
    entrypoint: ["/app/seed"]
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bia.app}
      ADMIN_NAME: ${ADMIN_NAME:-Admin BIA}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrator:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: biaenergy-backend:local
    container_name: biaenergy-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT: ${AI_TIMEOUT:-2m}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-12h}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy

volumes:
  pgdata:
